    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2129"/><stop offset="1" stop-color="#0B0F13"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#ink)"/>
