<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tower app icon: amber control tower on ink, mint window band. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B222A"/>
      <stop offset="1" stop-color="#0E1216"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7B872"/>
      <stop offset="0.5" stop-color="#F2A65A"/>
      <stop offset="1" stop-color="#D98B3F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FE0C8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7FE0C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS icon grid: 824px rounded square centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#12171D" stroke-width="2"/>

  <!-- soft mint glow behind the cab -->
  <ellipse cx="512" cy="380" rx="330" ry="150" fill="url(#glow)"/>

  <!-- base -->
  <rect x="352" y="748" width="320" height="52" rx="14" fill="url(#amber)"/>
  <!-- shaft, tapered -->
  <polygon points="434,748 590,748 562,460 462,460" fill="url(#amber)"/>
  <!-- cab: inverted trapezoid -->
  <polygon points="296,318 728,318 656,468 368,468" fill="url(#amber)"/>
  <!-- roof cap -->
  <rect x="318" y="270" width="388" height="56" rx="16" fill="url(#amber)"/>
  <!-- window band (mint) -->
  <polygon points="332,346 692,346 662,410 362,410" fill="#7FE0C8"/>
  <!-- mullions in ink so the band reads as windows -->
  <rect x="424" y="346" width="18" height="64" fill="#12171D"/>
  <rect x="503" y="346" width="18" height="64" fill="#12171D"/>
  <rect x="582" y="346" width="18" height="64" fill="#12171D"/>
  <!-- antenna and beacon -->
  <rect x="504" y="196" width="16" height="80" fill="url(#amber)"/>
  <circle cx="512" cy="188" r="22" fill="#7FE0C8"/>
</svg>
